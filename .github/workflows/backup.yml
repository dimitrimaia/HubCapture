# Backup semanal do banco (Supabase) · guia: docs/backup.md
# Roda todo domingo às 3h (Brasília) e quando você clica em "Run workflow".
# O arquivo sai CRIPTOGRAFADO (AES-256): o repositório é público e qualquer pessoa logada no
# GitHub consegue baixar artefatos de repositórios públicos. Sem a BACKUP_SENHA ele é inútil.
name: Backup do banco

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Conferir segredos
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_SENHA: ${{ secrets.BACKUP_SENHA }}
        run: |
          if [ -z "$BACKUP_DATABASE_URL" ] || [ -z "$BACKUP_SENHA" ]; then
            echo "::error::Cadastre BACKUP_DATABASE_URL e BACKUP_SENHA em Settings → Secrets and variables → Actions (docs/backup.md)."
            exit 1
          fi

      - name: Instalar pg_dump 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Gerar e criptografar o backup
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_SENHA: ${{ secrets.BACKUP_SENHA }}
        run: |
          set -euo pipefail
          ARQUIVO="hubcapture-$(date -u +%Y-%m-%d).dump"
          # Só as tabelas do site (public.*), formato custom (compactado, restaura com pg_restore).
          # Sem recriar o schema public, que já existe em qualquer banco novo.
          /usr/lib/postgresql/17/bin/pg_dump "$BACKUP_DATABASE_URL" -t 'public.*' --no-owner --no-privileges -Fc -f "$ARQUIVO"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_SENHA" --symmetric --cipher-algo AES256 -o "$ARQUIVO.gpg" "$ARQUIVO"
          rm -f "$ARQUIVO"
          echo "ARQUIVO=$ARQUIVO.gpg" >> "$GITHUB_ENV"
          ls -lh "$ARQUIVO.gpg"

      - name: Guardar por 90 dias
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARQUIVO }}
          path: ${{ env.ARQUIVO }}
          retention-days: 90
          if-no-files-found: error
